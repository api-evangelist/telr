notes: >-
  Telr test mode is toggled per transaction (test=1 on the legacy gateway,
  "test": true on the REST Payments API) rather than via separate test keys. Test
  cards work only in test mode and never for live transactions. All values below
  are published verbatim by Telr; none are invented.
test_mode:
  legacy_gateway: "order.test = 1 (0 = live, 1 = test)"
  remote: "tran.test = 1"
  rest_payments: '"test": true'
