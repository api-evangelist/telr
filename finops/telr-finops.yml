meters:
- name: monthly_plan_fee
  description: Fixed monthly gateway plan fee, banded by processing volume and region.
  unit: months
  aggregation: sum
  dimensions:
  - store
  - region
  - plan
- name: transaction_percentage_fee
  description: Percentage of transaction value charged per successful transaction.
  unit: currency
  aggregation: sum
  dimensions:
  - store
  - method
  - currency
- name: transaction_fixed_fee
  description: Fixed per-transaction fee (e.g. AED 0.50-1.00 or SAR 1.00).
  unit: transactions
  aggregation: sum
  dimensions:
  - store
  - method
  - currency
- name: local_rail_fee
  description: Distinct rates for local rails (mada, STC Pay, UR Pay) in KSA.
  unit: currency
  aggregation: sum
  dimensions:
  - store
  - rail
- name: vat
  description: Value-added tax applied to fees (5% UAE, 15% KSA).
  unit: currency
  aggregation: sum
  dimensions:
  - store
  - region
principles:
- name: Visibility
  description: Pull settlement and fee reports from Merchant Administration; break out fees by method and currency.
- name: Allocation
  description: Tag stores/sub-merchants per brand or marketplace seller; map split-payment fees to the right cost center.
- name: Optimization
  description: Route local KSA payments to mada/STC Pay/UR Pay (lower rates than credit card); pick the volume band that matches monthly throughput; reduce chargebacks with 3-D Secure and risk rules.
- name: Accountability
  description: Reconcile monthly plan + per-transaction fees against processed volume; review method mix against the plan band each month.
