description: >-
  FinOps view of Telr merchant spend. Telr bills a fixed monthly plan fee plus
  per-transaction cost (a percentage of transaction value plus a fixed
  per-transaction fee), banded by monthly processing volume and region. UAE is
  billed in AED, Saudi Arabia in SAR, with distinct rates for local rails (mada,
  STC Pay, UR Pay). VAT applies (5% UAE, 15% KSA). Cost drivers are transaction
  count, average ticket size, method mix (card vs. local wallet), and
  refund/chargeback activity rather than API call volume.
notes: >-
  Percentage + fixed fees vary by plan band and region; verify against the Telr
  pricing page during reconciliation. Acquiring-bank setup/monthly fees may
  apply separately.
