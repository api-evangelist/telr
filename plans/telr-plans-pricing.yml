specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Telr
providerId: telr
created: '2026-07-17'
modified: '2026-07-17'
reconciled: true
tags:
- Payments
- Payment Gateway
- FinTech
- MENA
- UAE
- Plans
description: >-
  Telr sells the payment gateway to merchants on volume-banded monthly plans
  with per-transaction pricing, rather than metering API calls. UAE plans are
  priced in AED and Saudi Arabia plans in SAR; local rails (mada, STC Pay, UR
  Pay) carry distinct rates in KSA. There is no published setup fee for the
  standard tiers (bank setup fees may apply separately). High-volume merchants
  (>AED 500,000/month) get custom pricing. All fees are subject to VAT (5% UAE,
  15% KSA). The developer APIs themselves are free to use with a merchant
  account.
notes: >-
  Rates transcribed from the Telr pricing page on 2026-07-17; verify current
  bands and rates on the page, which vary by region and are subject to VAT and
  acquiring-bank terms.
sources:
- https://telr.com/pricing
- https://telr.com/sa-en/pricing/
