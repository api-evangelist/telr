generated: '2026-07-17'
method: searched
source: https://docs.telr.com/reference/authorisation-response-codes
notes: >-
  Telr's authorisation response codes. Each transaction response carries a status
  LETTER and a numeric CODE. Status letters: A = Authorised, H = Authorised but
  held for manual review, D = Declined, E = Error/invalid request, C = Cancelled,
  X = Expired. The numeric code disambiguates the reason. In test mode these can
  be simulated by padding the desired code to three digits and passing it as the
  CVV (e.g. CVV 041 => code 41 Insufficient funds); see sandbox/telr-sandbox.yml.
envelope_field: "transaction.status (letter) + transaction.code (number); legacy gateway returns these on the order/transaction status object"
status_letters:
  A: Authorised
  H: Authorised - on hold, manual inspection required
  D: Declined
  E: Error / invalid request
  C: Cancelled
  X: Expired
