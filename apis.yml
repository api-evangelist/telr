    type: Documentation
  - url: https://docs.telr.com/reference/remote-creation-of-invoices
    type: APIReference
  description: >-
    Remote creation of QuickLink payment links and e-invoices with extra data fields, for merchants who
    collect payment without a full checkout integration.
