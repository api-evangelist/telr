apis:
- aid: telr:telr-accounts-split-payments-api
  name: Telr Accounts and Split Payments API
  tags:
  - Marketplace
  - Split Payments
  - Payouts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.telr.com/reference/split-payment
  baseURL: https://secure.telr.com/api/v1
  properties:
  - url: https://docs.telr.com/reference/split-payment
    type: Documentation
  - url: https://docs.telr.com/reference/authentication
    type: APIReference
  description: >-
    Marketplace / split-payment Service API for sub-merchant onboarding, multi-split payments, debit/credit
    of sub-merchant accounts, payouts, and transaction reconciliation. Authenticated with HTTP Basic auth
    (merchant id as username, API key as password).
- aid: telr:telr-quicklink-einvoicing-api
  name: Telr QuickLink and E-Invoicing API
  tags:
